<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detection Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .spam-badge { font-size: 1.2rem; }
    </style>
</head>
<body class="py-5">

<div class="container">
    <h2 class="text-center mb-4 fw-bold text-primary">🛡️ Spam Detection & Analytics Dashboard</h2>

    <div class="row g-4">
        <!-- Input Form Column -->
        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="card-title fw-semibold mb-3">Analyze Text</h5>
                <div class="mb-3">
                    <textarea id="inputText" class="form-control" rows="6" placeholder="Paste email, message, or review text here..."></textarea>
                </div>
                <button onclick="analyzeText()" class="btn btn-primary w-100 btn-lg">Detect & Visualize</button>
            </div>
        </div>

        <!-- Result & Visualizations Column -->
        <div class="col-lg-6">
            <div class="card p-4 h-100">
                <h5 class="card-title fw-semibold mb-3">Prediction Summary</h5>
                
                <div id="resultBox" class="text-center my-3" style="display:none;">
                    <span id="predictionBadge" class="badge p-3 spam-badge"></span>
                </div>

                <div class="row mt-3">
                    <!-- Gauge / Donut Chart -->
                    <div class="col-md-6 text-center">
                        <h6>Confidence Probability</h6>
                        <canvas id="probChart" width="200" height="200"></canvas>
                    </div>
                    <!-- Detected Words List -->
                    <div class="col-md-6">
                        <h6>Key Vocabulary Detected</h6>
                        <div id="wordList" class="d-flex flex-wrap gap-1 mt-2">
                            <span class="text-muted small">No words detected yet.</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
let chartInstance = null;

async function analyzeText() {
    const text = document.getElementById('inputText').value;
    if (!text.trim()) return alert("Please enter text to analyze.");

    const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
    });

    const data = await response.json();
    if (data.error) return alert(data.error);

    // Update Result Badge
    const resultBox = document.getElementById('resultBox');
    const badge = document.getElementById('predictionBadge');
    resultBox.style.display = 'block';

    if (data.is_spam) {
        badge.className = "badge bg-danger p-3 spam-badge";
        badge.innerText = "🚨 " + data.prediction + " Detected";
    } else {
        badge.className = "badge bg-success p-3 spam-badge";
        badge.innerText = "✅ " + data.prediction;
    }

    // Update Key Words List
    const wordContainer = document.getElementById('wordList');
    wordContainer.innerHTML = '';
    if (data.words.length > 0) {
        data.words.forEach(word => {
            const tag = document.createElement('span');
            tag.className = 'badge bg-secondary';
            tag.innerText = word;
            wordContainer.appendChild(tag);
        });
    } else {
        wordContainer.innerHTML = '<span class="text-muted small">No dictionary matches.</span>';
    }

    // Render / Update Donut Chart
    renderChart(data.prob_spam, data.prob_ham);
}

function renderChart(spamProb, hamProb) {
    const ctx = document.getElementById('probChart').getContext('2d');
    
    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Spam %', 'Legitimate %'],
            datasets: [{
                data: [spamProb, hamProb],
                backgroundColor: ['#dc3545', '#198754']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
}
</script>

</body>
</html>
